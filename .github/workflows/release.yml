name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            binary: exa-linux-x64
          - os: ubuntu-latest
            target: bun-linux-arm64
            binary: exa-linux-arm64
          - os: ubuntu-latest
            target: bun-darwin-x64
            binary: exa-darwin-x64
          - os: ubuntu-latest
            target: bun-darwin-arm64
            binary: exa-darwin-arm64
          - os: windows-latest
            target: bun-windows-x64
            binary: exa-windows-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Build binary
        run: bun build src/index.ts --compile --target ${{ matrix.target }} --outfile ${{ matrix.binary }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: ${{ matrix.binary }}

  publish:
    name: Create Release
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          # Needed for npm provenance / trusted publishing
          # See: https://docs.npmjs.com/generating-provenance-statements

      - name: Install dependencies
        run: bun install

      - name: Publish to npm
        run: npm publish --access public --provenance

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: artifacts/*
          draft: false
          prerelease: false
